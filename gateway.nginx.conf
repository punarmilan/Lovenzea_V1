events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Auto-created by certbot
    # SSL configuration paths
    # ssl_certificate     /etc/letsencrypt/live/lovenzea.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/lovenzea.com/privkey.pem;

    # Upstream services
    upstream backend_service {
        server backend:8080;
    }

    upstream minio_service {
        server minio:9000;
    }

    upstream web_frontend {
        server web-frontend:80;
    }

    upstream admin_frontend {
        server admin-frontend:80;
    }

    # Map to redirect non-www to www (optional, keep simple)
    # All main website domains serve the same web-frontend

    # ============================================================
    # HTTP Server - ACME challenges + redirect to HTTPS
    # ============================================================
    server {
        listen 80;
        listen [::]:80;
        server_name lovenzea.com www.lovenzea.com lovenzea.in www.lovenzea.in lovenzea.online www.lovenzea.online app.lovenzea.online 187.127.132.81;

        # Let's Encrypt SSL certificate verification path
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # API/backend on app.lovenzea.online (HTTP fallback)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================================
    # HTTPS - Main Website (lovenzea.com / .in / .online)
    # ============================================================
    server {
        listen 443 ssl http2;
        server_name lovenzea.com www.lovenzea.com lovenzea.in www.lovenzea.in lovenzea.online www.lovenzea.online;

        ssl_certificate     /etc/letsencrypt/live/lovenzea.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lovenzea.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # API proxy to backend (same-origin /api requests)
        location /api/ {
            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket proxy
        location /ws {
            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MinIO photos public storage route
        location /api/photos/ {
            proxy_pass http://minio_service/lovenzea-photos/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Main website static frontend
        location / {
            proxy_pass http://web_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ============================================================
    # HTTPS - Admin Panel (asp-admin.lovenzea.online)
    # TEMPORARILY DISABLED - DNS record not created yet.
    # To enable: add DNS A record asp-admin -> 187.127.132.81,
    # get cert with: certbot certonly --standalone -d asp-admin.lovenzea.online
