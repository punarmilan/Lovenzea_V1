    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }

    # ============================================================
    # HTTPS - Backend API (app.lovenzea.online)
    # ============================================================
    server {
        listen 443 ssl http2;
        server_name app.lovenzea.online;

        ssl_certificate     /etc/letsencrypt/live/app.lovenzea.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.lovenzea.online/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # MinIO photos public storage route
        location /api/photos/ {
            proxy_pass http://minio_service/lovenzea-photos/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Backend Spring Boot API & STOMP WebSockets
        location / {
            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}