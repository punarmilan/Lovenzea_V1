version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: lovenzea-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: lovenzea_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: lovenzea-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lovenzea-rabbitmq
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp && rabbitmq-server"
    ports:
      - "5672:5672"
      - "15672:15672"
      - "61613:61613" # STOMP
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ALLOW_REMOTE_GUEST_ACCESS: "true"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: lovenzea-minio
    ports:
      - "9000-9001:9000-9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-config:
    image: minio/mc
    container_name: lovenzea-minio-config
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin}) do echo 'Waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb local/lovenzea-photos || true;
      /usr/bin/mc anonymous set download local/lovenzea-photos;
      echo 'MinIO Configuration Applied Successfully!';
      exit 0;
      "

  backend:
    image: ${DOCKERHUB_USERNAME:-worknai009}/lovenzea-backend:latest
    container_name: lovenzea-backend
    env_file: .env
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_MASTER_URL: jdbc:mysql://mysql:3306/lovenzea_db
      SPRING_DATASOURCE_REPLICA_URL: jdbc:mysql://mysql:3306/lovenzea_db
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      MINIO_URL: http://minio:9000
      MINIO_PUBLIC_URL: https://app.lovenzea.online/api/photos
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-lovenzea-photos}
      JWT_SECRET: ${JWT_SECRET}
      CHAT_ENCRYPTION_KEY: ${CHAT_ENCRYPTION_KEY}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      LOG_LEVEL_APP: INFO
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  web-frontend:
    image: ${DOCKERHUB_USERNAME:-worknai009}/lovenzea-web-frontend:latest
    container_name: lovenzea-web-frontend
    restart: unless-stopped
    expose:
      - "80"
    deploy:
      resources:
        limits:
          memory: 256M

  admin-frontend:
    image: ${DOCKERHUB_USERNAME:-worknai009}/lovenzea-admin-frontend:latest
    container_name: lovenzea-admin-frontend
    restart: unless-stopped
    expose:
      - "80"
    deploy:
      resources:
        limits:
          memory: 256M

  nginx-gateway:
    image: nginx:alpine
    container_name: lovenzea-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/www/lovenzea/gateway.nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      web-frontend:
        condition: service_started
      admin-frontend:
        condition: service_started

  watchtower:
    image: containrrr/watchtower
    container_name: lovenzea-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  minio_data: