name: Build & Deploy Backend to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-push-backend:
    name: Build & Push Backend Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/punarmilan-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/punarmilan-backend:${{ github.sha }}

  deploy-backend:
    name: Deploy Backend to VPS
    needs: build-and-push-backend
    runs-on: ubuntu-latest

    steps:
      - name: Execute SSH commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: ENV_FILE
          script: |
            set -e
            echo "--- Preparing deployment directory ---"
            mkdir -p /var/www/punarmilan/source
            cd /var/www/punarmilan/source

            if [ ! -d ".git" ]; then
              echo "Repository not found locally, cloning..."
              git clone https://github.com/punarmilan/LovenZea_Native_App.git .
            else
              echo "Pulling latest code from origin..."
              git fetch origin main || git fetch origin master
              git reset --hard origin/$(git rev-parse --abbrev-ref HEAD)
            fi

            if [ -n "$ENV_FILE" ]; then
              echo "--- Writing .env file from GitHub Secrets ---"
              echo "$ENV_FILE" > .env
            fi

            echo "--- Copying gateway configuration ---"
            cp gateway.nginx.conf /var/www/punarmilan/gateway.nginx.conf 2>/dev/null || true

            echo "--- Pulling latest Docker images ---"
            docker compose pull backend

            echo "--- Deploying Docker Compose services ---"
            docker compose up -d --remove-orphans

            echo "--- Cleaning up unused images ---"
            docker image prune -f

            echo "--- Backend Deployment Complete ---"
