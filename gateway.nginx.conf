events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    upstream backend_service {
        server backend:8080;
    }

    upstream minio_service {
        server minio:9000;
    }

    server {
        listen 80;
        server_name app.lovenzea.online 187.127.132.81;

        # Let's Encrypt SSL certificate verification path
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # MinIO photos public storage route
        location /api/photos/ {
            proxy_pass http://minio_service/punarmilan-photos/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Backend Spring Boot API & STOMP WebSockets
        location / {
            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
